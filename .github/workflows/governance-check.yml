name: Governance check
on:
  pull_request:
    types: [opened, edited, synchronize]
  push:
    branches: [main]
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run governance:validate
      - run: npm run governance:generate
      - run: git diff --exit-code -- docs/governance/ROADMAP.md docs/governance/PROJECT_STATUS.md docs/governance/CAPABILITY_MATRIX.md
      - if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/governance/check-pr-evidence.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
